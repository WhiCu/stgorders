server:
  host: "0.0.0.0"
  port: "8080"
  read_timeout: "10s"
  write_timeout: "30s"
  idle_timeout: "30s"

logger:
  level: "info" 
  path: "./logs/kafka-consumer.log"
  size: 128
  compress: true

kafka:
  brokers: 
    - "0.0.0.0:9092"
  topic: "test-topic"
  group_id: "my-group"
  worker_pool:
    size: 10
    buf: 128


storage:
  host: "localhost"
  port: "5432"
  user: "user"
  password: "password"
  db: "l0_test"

cache:
  size: 128